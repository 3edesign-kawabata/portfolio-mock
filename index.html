<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORK 仮組み | 3e design</title>

<link rel="icon" href="assets/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon-180x180.png" sizes="180x180">

<style>
  :root {
    --bg: #fff;
    --fg: #111;
    --overlay-bg: rgba(0,0,0,0.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic Medium", "Meiryo", sans-serif;
  }

  header {
    padding: 40px 20px 20px;
    text-align: center;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin: 0;
  }

  header p {
    margin: 8px 0 0;
    font-size: 12px;
    color: #888;
  }

  .work_grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  @media (max-width: 900px) {
    .work_grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 600px) {
    .work_grid { grid-template-columns: repeat(2, 1fr); }
  }

  .work_card {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #000;
  }

  .work_card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.9;
    transition: opacity 0.35s, transform 0.35s;
  }

  .work_card:hover img {
    opacity: 1;
    transform: scale(1.05);
  }

  .work_title {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 15px;
    font-size: 13px;
    line-height: 1.5;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
    z-index: 5;
  }

  .work_client {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    z-index: 10;
    font-size: 14px;
    line-height: 1.6;
    transform: translate3d(0, 101%, 0);
    transition: transform 0.35s;
  }

  .work_client span {
    display: block;
    width: 100%;
    background: var(--overlay-bg);
    color: #fff;
    padding: 15.8px;
  }

  .work_client .label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #ccc;
    margin-bottom: 2px;
  }

  .work_card:hover .work_client {
    transform: translate3d(0, 1px, 0);
  }

  .work_card:hover .work_title {
    opacity: 0;
  }
</style>
</head>
<body>

<header>
  <h1>WORK - 仮組みページ</h1>
  <p>portfolio-mock / grid layout prototype</p>
</header>

<div class="work_grid" id="work_grid"></div>

<script>
fetch('works.json')
  .then(res => res.json())
  .then(works => {
    const grid = document.getElementById('work_grid');
    grid.innerHTML = works.map(w => `
      <div class="work_card">
        <img src="${w.image}" alt="${w.title}" loading="lazy">
        <div class="work_title">${w.title}</div>
        <div class="work_client"><span><span class="label">CLIENT</span>${w.title}</span></div>
      </div>
    `).join('');
  });
</script>

</body>
</html>
