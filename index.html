<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORK 仮組み | 3e design</title>

<link rel="icon" href="assets/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon-180x180.png" sizes="180x180">

<style>
  /*
    余白・タイポグラフィの数値は https://www.awatsujidesign.com/works/ の
    実CSS（aw-theme/asset/css/style.css）から抽出した値をそのまま使用。
  */
  * { box-sizing: border-box; }

  html { font-size: 62.5%; } /* 1rem = 10px, AWATSUJIと同じ基準 */

  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic Medium", "Meiryo", sans-serif;
  }

  /* ヘッダー〜見出し（.l-container.works 相当） */
  header {
    margin-top: 104px;
    padding-top: 48px;
    padding-bottom: 0;
    text-align: center;
  }

  @media (max-width: 768px) {
    header {
      margin-top: 64px;
      padding-top: 48px;
    }
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin: 0;
  }

  header p {
    margin: 8px 0 0;
    font-size: 1.2rem;
    color: #888;
  }

  /* 見出し〜グリッド（.mgn-bottom-high: --size-high / --size-high-s） */
  header {
    margin-bottom: 120px;
  }
  @media (max-width: 768px) {
    header { margin-bottom: 84px; }
  }

  /* コンテナ左右余白（.pd-side: padding-left/right 5%、max-widthなしのフルード） */
  .work_grid_wrap {
    padding-left: 5%;
    padding-right: 5%;
    /* グリッド〜フッター（.works-thumbs-box-mgn-bottom） */
    margin-bottom: 52px;
  }
  @media (max-width: 768px) {
    .work_grid_wrap { margin-bottom: 112px; }
  }

  /* グリッド本体（CSS Grid化。列間gapは12.5%相当・行間gapは96pxを維持） */
  .work_grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 12.5%;
    row-gap: 96px;
  }

  .work_card {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #fff;
  }

  @media (max-width: 768px) {
    .work_grid {
      grid-template-columns: repeat(2, 1fr);
      column-gap: 6%;
      row-gap: 20px;
    }
  }

  .work_card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* hover時に画像全体を覆う黒半透明レイヤー＋中央タイトル（.entry-cover / .entry-cover-title） */
  .work_cover {
    position: absolute;
    inset: 0;
    display: block;
    background: rgba(0, 0, 0, 0);
    opacity: 0;
    transition: all .8s ease-out;
  }

  .work_card:hover .work_cover {
    background: rgba(0, 0, 0, .6);
    opacity: 1;
    cursor: pointer;
  }

  .work_title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateY(-50%) translateX(-50%);
    width: 100%;
    text-align: center;
    font-weight: 100;
    font-size: 1.6rem;
    color: #fff;
    line-height: 1.75;
    letter-spacing: .1em;
  }

  .work_title .label {
    display: block;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: .15em;
    color: #ccc;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>WORK - 仮組みページ</h1>
  <p>portfolio-mock / grid layout prototype</p>
</header>

<div class="work_grid_wrap">
  <div class="work_grid" id="work_grid"></div>
</div>

<script>
fetch('works.json')
  .then(res => res.json())
  .then(works => {
    const grid = document.getElementById('work_grid');
    grid.innerHTML = works.map(w => `
      <div class="work_card">
        <img src="${w.image}" alt="${w.title}" loading="lazy">
        <a class="work_cover" href="#">
          <span class="work_title"><span class="label">CLIENT</span>${w.title}</span>
        </a>
      </div>
    `).join('');
  });
</script>

</body>
</html>
